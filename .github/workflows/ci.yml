# Проверка кода на каждом PR и пуше в main: ruff и pytest, без сборки exe.
# Нужна, чтобы чужие PR проверялись до мержа. Windows — потому что программа и
# тесты завязаны на Windows (ctypes.windll, именованные события, schtasks).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt

      # Новый фронт (frontend/): типы и сборка. Сборка в ui/web-next нужна и тестам —
      # они проверяют, что бандл лежит там, куда его ждут движки окна.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Фронт — зависимости
        working-directory: frontend
        run: npm ci

      - name: Фронт — typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Фронт — lint и тесты
        working-directory: frontend
        run: |
          npm run lint
          npm test

      - name: Фронт — сборка
        working-directory: frontend
        run: npm run build

      - name: Лендинг — сборка
        working-directory: frontend
        run: npm run build:landing

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Оформление — живой интерфейс
        run: python tools/smoke_appearance.py --screenshot appearance.png

      - name: Размеры окна — живой интерфейс
        run: python tools/smoke_layout.py --screenshot layout.png

      - name: Автосохранение — живой интерфейс
        run: python tools/smoke_autosave.py

      - name: Игровой фильтр — живой интерфейс
        run: python tools/smoke_filters.py

      - name: Проверки сайтов — живой интерфейс
        run: python tools/smoke_checks.py

      - name: Автонастройка — живой интерфейс
        run: python tools/smoke_autotune.py --screenshot autotune.png

      - name: Пробы настроек — живой интерфейс
        run: python tools/smoke_trials.py --screenshot trial.png

      - name: Проверенная конфигурация — живой интерфейс
        run: python tools/smoke_verified_config.py --screenshot verified.png

      - name: WebView2 Runtime для проверки исходников
        run: ./tools/ensure_webview_runtime.ps1

      - name: Оформление — нативное окно WebView2
        run: python tools/smoke_native_appearance.py

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: appearance-check
          path: |
            appearance.png
            layout.png
            trial.png
            verified.png
            autotune.png
          if-no-files-found: ignore
