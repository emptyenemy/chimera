# Проверка кода на каждом PR и пуше в main: ruff и pytest, без сборки exe.
# Нужна, чтобы чужие PR проверялись до мержа. Windows — потому что программа и
# тесты завязаны на Windows (ctypes.windll, именованные события, schtasks).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt

      # Новый фронт (frontend/): типы и сборка. Сборка в ui/web-next нужна и тестам —
      # они проверяют, что бандл лежит там, куда его ждут движки окна.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Фронт — зависимости
        working-directory: frontend
        run: npm ci

      - name: Фронт — typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Фронт — сборка
        working-directory: frontend
        run: npm run build

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
