# Проверка кода на каждом PR и пуше в main: ruff и pytest, без сборки exe.
# Нужна, чтобы чужие PR проверялись до мержа. Windows — потому что программа и
# тесты завязаны на Windows (ctypes.windll, именованные события, schtasks).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
