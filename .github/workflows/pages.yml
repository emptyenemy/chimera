# Лендинг использует общие компоненты shadcn из frontend/. В Pages уходит landing/dist.

name: Pages

on:
  push:
    branches: [main]
    paths: [landing/**, frontend/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Зависимости лендинга
        working-directory: frontend
        run: npm ci
      - name: Сборка лендинга
        working-directory: frontend
        run: npm run build:landing
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing/dist
      - id: deployment
        uses: actions/deploy-pages@v5
