# Релиз по тегу: git tag v0.2.0 && git push origin v0.2.0.
# Тег с дефисом (v0.3.0-beta.1) публикуется пре-релизом — его видит только бета-канал
# самообновления. Подробности — docs/RELEASES.md.
# Запуск вручную (Actions → Release → Run workflow) — пробная сборка с полным дымовым
# тестом, без версии из тега и без публикации: проверить сборку до тега.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # создать релиз и прикрепить архив

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    # консоль раннера в cp1252 — print() с кириллицей в tools/*.py падает без UTF-8
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt

      # pytest здесь не гоняется: он уже прошёл в ci.yml на этом коммите main

      - name: Версия из тега
        id: ver
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python tools/set_version.py "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Бинарники (sing-box, winws2)
        run: python tools/fetch_bins.py

      # Кэш Nuitka: скомпилированные модули и скачанные ею инструменты — повторная
      # сборка заметно быстрее. Ключ — версия зависимостей, от них кэш и устаревает.
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Сборка
        shell: cmd
        run: call build.bat

      # Собранная программа начисто, как у пользователя: запуск без окна и вызовы
      # всех модулей через её же интерфейс (tools/smoke_build.py). Ловит то, что
      # тестам исходников не видно, — модуль или файл, не попавший в exe.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Дымовой тест сборки
        run: python tools/smoke_build.py build\Chimera --full

      - name: Архив
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python -c "import shutil; shutil.make_archive('Chimera-${{ steps.ver.outputs.version }}-win64', 'zip', root_dir='build', base_dir='Chimera')"
          ls -la Chimera-*-win64.zip

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="Chimera-${{ steps.ver.outputs.version }}-win64.zip"
          # хеш архива — в описание релиза: по нему можно сверить скачанный zip;
          # своё описание встаёт перед автоматическим списком изменений
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          echo "SHA256 $zip: $sha"
          flags=(--generate-notes --title "Chimera $GITHUB_REF_NAME" --notes "SHA256 архива $zip: $sha")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$zip" "${flags[@]}"
