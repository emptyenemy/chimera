# Тег v* публикует три сборки. Ручной запуск проверяет их без публикации.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: qt
            folder: Chimera
            suffix: ""
          - flavor: webview
            folder: Chimera-webview
            suffix: -webview
          - flavor: lite
            folder: Chimera-lite
            suffix: -lite
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: Версия из тега
        id: ver
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python tools/set_version.py "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Бинарники
        run: python tools/fetch_bins.py
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ matrix.flavor }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: nuitka-${{ runner.os }}-${{ matrix.flavor }}-
      - name: Сборка
        shell: cmd
        run: call build.bat ${{ matrix.flavor }}
      - name: Дымовой тест сборки
        run: python tools/smoke_build.py build\${{ matrix.folder }} --flavor ${{ matrix.flavor }} --full
      - name: Архив
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import shutil; shutil.make_archive('Chimera-${{ steps.ver.outputs.version }}-win64${{ matrix.suffix }}', 'zip', root_dir='build', base_dir='${{ matrix.folder }}')"
      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-${{ matrix.flavor }}
          path: Chimera-*-win64*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: archives
      - name: Релиз
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          zips=(archives/Chimera-*-win64*.zip)
          [[ ${#zips[@]} == 3 ]] || exit 1
          sha256sum "${zips[@]}" > checksums.txt
          { echo 'SHA256 архивов:'; echo; cat checksums.txt; } > release-notes.txt
          flags=(--generate-notes --title "Chimera $GITHUB_REF_NAME" --notes-file release-notes.txt)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${zips[@]}" "${flags[@]}"
