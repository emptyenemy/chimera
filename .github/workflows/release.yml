# Тег v* публикует три сборки. Ручной запуск проверяет их без публикации.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для проверки сборок без публикации (например, 1.0.1)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: qt
            folder: Chimera
            suffix: ""
          - flavor: webview
            folder: Chimera-webview
            suffix: -webview
          - flavor: lite
            folder: Chimera-lite
            suffix: -lite
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: Версия и проверка заметок
        id: ver
        env:
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        shell: bash
        run: |
          if [[ -n "$BUILD_VERSION" ]]; then
            python tools/set_version.py "$BUILD_VERSION"
            python tools/release_notes.py "$BUILD_VERSION" --output release-notes-preview.txt
            echo "version=${BUILD_VERSION#v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Бинарники
        run: python tools/fetch_bins.py
      - uses: actions/cache/restore@v6
        id: nuitka-cache
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py313-${{ matrix.flavor }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: nuitka-${{ runner.os }}-py313-${{ matrix.flavor }}-
      - name: Сборка
        shell: cmd
        run: call build.bat ${{ matrix.flavor }}
      - name: Архив
        if: steps.ver.outputs.version != ''
        run: python -c "import shutil; shutil.make_archive('Chimera-${{ steps.ver.outputs.version }}-win64${{ matrix.suffix }}', 'zip', root_dir='build', base_dir='${{ matrix.folder }}')"
      - uses: actions/upload-artifact@v6
        if: steps.ver.outputs.version != ''
        with:
          name: release-${{ matrix.flavor }}
          path: Chimera-*-win64*.zip
          if-no-files-found: error
      - name: Сохранить кэш компиляции
        if: steps.nuitka-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ steps.nuitka-cache.outputs.cache-primary-key }}
      - name: Версия готового exe
        run: '& .\build\${{ matrix.folder }}\Chimera.exe --version'
      - name: Дымовой тест сборки
        run: python tools/smoke_build.py build\${{ matrix.folder }} --flavor ${{ matrix.flavor }} --full

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: archives
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Обновление настоящего архива 1.0.0
        shell: bash
        run: |
          version="${BUILD_VERSION#v}"
          python tools/verify_upgrade.py "archives/Chimera-${version}-win64.zip" --version "$version"
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          zips=(archives/Chimera-*-win64*.zip)
          [[ ${#zips[@]} == 3 ]] || exit 1
          (cd archives && sha256sum Chimera-*-win64*.zip) > checksums.txt
          python tools/release_notes.py "$GITHUB_REF_NAME" --checksums checksums.txt --output release-notes.txt
          flags=(--title "Chimera $GITHUB_REF_NAME" --notes-file release-notes.txt)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${zips[@]}" "${flags[@]}"
