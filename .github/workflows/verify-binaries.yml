name: Verify packaged archives

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release run с архивом release-webview"
        required: true
        type: string
      version:
        description: "Версия архивов"
        required: true
        default: "1.0.1"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  native-webview:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v7
        with:
          name: release-webview
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: archives
      - name: Распаковать проверяемый архив
        run: python -c "from pathlib import Path; from modules.selfupdate import stage; archives=list(Path('archives').glob('*.zip')); assert len(archives)==1; dest=Path('native').resolve(); assert dest.is_relative_to(Path.cwd()); print(stage(archives[0], dest))"
      - name: WebView2 Runtime для проверки окна
        run: .\tools\ensure_webview_runtime.ps1
      - name: Нативный WebView2 и канал CLI
        run: python tools/smoke_build.py native\Chimera-webview --flavor webview --native-webview

  upgrade:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      BUILD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v7
        with:
          name: release-qt
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: archives
      - name: Обновление настоящего архива 1.0.0
        run: python tools/verify_upgrade.py "archives/Chimera-${env:BUILD_VERSION}-win64.zip" --version "$env:BUILD_VERSION"
