# Настройки dev-инструментов (ruff, pytest). Проект НЕ оформлен как устанавливаемый
# пакет — нет [project]/build-backend, main.py запускается напрямую из корня.

[tool.ruff]
target-version = "py314"
# 158 — самая длинная реальная строка в modules/ на момент написания; берём с
# запасом, чтобы E501 не заваливал репорт стилем, который и так уже принят в коде.
line-length = 160
extend-exclude = ["upstream", "bin"]

[tool.ruff.lint]
# Умеренный набор: явные ошибки (F), синтаксис/пробелы (E, W), типичные баги
# (B — flake8-bugbear), устаревшие конструкции (UP — pyupgrade). Без стилистики
# вроде import-sort или docstring-правил — шума и так хватит на первый прогон.
select = ["E", "F", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
