<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chimera</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/dashboard.css">
<link rel="stylesheet" href="css/pages/strategies.css">
<link rel="stylesheet" href="css/pages/proxy.css">
<link rel="stylesheet" href="css/pages/telegram.css">
<link rel="stylesheet" href="css/pages/hosts.css">
<link rel="stylesheet" href="css/pages/dns.css">
<link rel="stylesheet" href="css/pages/lists.css">
<link rel="stylesheet" href="css/pages/checks.css">
<link rel="stylesheet" href="css/pages/settings.css">
<style>
/* Плашка «модулями управляет служба» — у shell.js нет своего css-файла, стилей на одно
   мелкое сообщение хватает тут; токены те же, что и у остального сайдбара. */
.sb-service { display: flex; align-items: flex-start; gap: 8px; margin: 0 8px 8px; padding: 8px 10px; overflow: hidden;
  border-radius: var(--radius); background: var(--sidebar-accent); font-size: 12.5px; line-height: 16px; }
.sb-service .icon { flex: none; margin-top: 1px; color: var(--muted-foreground); }
/* min-width — чтобы при анимации ширины текст не переносился в столбик и плашка не прыгала */
.sb-service span { min-width: 160px; transition: opacity .15s ease; }
.sb-collapsed .sb-service { padding: 8px; height: 32px; }
.sb-collapsed .sb-service span { opacity: 0; }
</style>
<script>
/* Сворачивание сайдбара — до первой отрисовки, иначе свёрнутая панель мигнёт развёрнутой.
   Остальная логика (кнопка, Ctrl+B) — в js/shell.js. */
try {
  if (JSON.parse(localStorage.getItem("chimera.sidebar") || "{}").collapsed)
    document.documentElement.classList.add("sb-collapsed");
} catch {}
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-header">
      <div class="sb-logo"><i data-logo></i></div>
      <div class="sb-brand">
        <b>Chimera</b>
        <span id="sb-ver"></span>
      </div>
      <button type="button" class="sb-toggle" id="sb-toggle" aria-label="Свернуть панель"
        data-tip="Свернуть панель · Ctrl+B" data-tip-rail="Развернуть панель · Ctrl+B">
        <i data-icon="panel-left-close" class="when-open"></i><i data-icon="panel-left-open" class="when-closed"></i>
      </button>
    </div>
    <div id="sb-service"></div>
    <nav class="sb-content" id="sb-nav"></nav>
    <div class="sb-footer">
      <div class="sb-status" id="sb-status">
        <div class="sb-status-row"><span class="dot"></span><span>Загрузка…</span></div>
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toaster" id="toaster"></div>

<!-- Порядок важен: иконки и ядро до страниц; порядок страниц = порядок в меню. -->
<script src="vendor/lucide/icons.js"></script>
<script src="js/logo.js"></script>
<script src="qwebchannel.js"></script>
<script src="js/core.js"></script>
<script src="js/shell.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/strategies.js"></script>
<script src="js/pages/proxy.js"></script>
<script src="js/pages/telegram.js"></script>
<script src="js/pages/hosts.js"></script>
<script src="js/pages/dns.js"></script>
<script src="js/pages/lists.js"></script>
<script src="js/pages/checks.js"></script>
<script src="js/pages/settings.js"></script>
</body>
</html>
